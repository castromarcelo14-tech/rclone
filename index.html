<h1>rclone personal – Política de privacidad</h1>
<p>Esta aplicación es de uso exclusivamente personal. La utiliza solo su dueño
para sincronizar sus propios archivos de Google Drive con su computadora mediante rclone.</p>
<p>No recopila, almacena ni comparte datos de ninguna otra persona.</p>
